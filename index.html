<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preposition Master</title>
<style>
  /* ===== ПЕРЕМЕННЫЕ И СБРОС СТИЛЕЙ ===== */
  :root {
    --bg: #111113;
    --bg-2: #1a1a1f;
    --bg-3: #222228;
    --text: #e8e8f0;
    --text-muted: #888899;
    --accent: #7c6cf0;
    --accent-hover: #9485f5;
    --accent-dim: rgba(124, 108, 240, 0.15);
    --correct: #4caf7d;
    --correct-dim: rgba(76, 175, 125, 0.18);
    --wrong: #e05c6e;
    --wrong-dim: rgba(224, 92, 110, 0.18);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ===== ЗЕРНОВАЯ ТЕКСТУРА ФОНА ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ===== ЭКРАНЫ ===== */
  .screen {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== ГЛАВНЫЙ ЭКРАН ===== */
  .home-header {
    text-align: center;
    padding: 4rem 0 3rem;
  }

  .logo-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(124,108,240,0.25);
  }

  .home-title {
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e8e8f0 30%, #a89cf0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.75rem;
  }

  .home-subtitle {
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 460px;
    margin: 0 auto 0.5rem;
  }

  /* ===== СЕТКА БУКВ ===== */
  .section-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
    margin-top: 2.5rem;
  }

  .letter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 10px;
    margin-bottom: 4rem;
  }

  .letter-btn {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.3rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .letter-btn .count {
    font-size: 9px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .letter-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(124,108,240,0.2) 0%, transparent 70%);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .letter-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(124,108,240,0.2);
  }

  .letter-btn:hover:not(:disabled)::after { opacity: 1; }

  .letter-btn:disabled {
    opacity: 0.28;
    cursor: not-allowed;
  }

  .letter-btn:active:not(:disabled) { transform: translateY(-1px); }

  /* ===== ЭКРАН ТЕСТА ===== */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 0 2rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all var(--transition);
  }

  .back-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .quiz-meta {
    text-align: right;
  }

  .quiz-letter-badge {
    display: inline-block;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    width: 48px;
    height: 48px;
    background: var(--accent-dim);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(124,108,240,0.25);
  }

  /* ===== СЧЁТЧИК ОЧКОВ ===== */
  .score-bar {
    display: flex;
    gap: 1rem;
    margin-bottom: 2.5rem;
    padding: 1rem 1.25rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .score-item {
    flex: 1;
    text-align: center;
  }

  .score-num {
    display: block;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-num.correct-color { color: var(--correct); }
  .score-num.wrong-color { color: var(--wrong); }
  .score-num.total-color { color: var(--accent); }

  .score-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }

  /* ===== ВОПРОС ===== */
  .question-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .question-category {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.2rem;
  }

  .question-word {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
  }

  .question-blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 3px solid var(--accent);
    color: transparent;
    vertical-align: bottom;
    margin: 0 4px;
  }

  /* ===== КНОПКИ ОТВЕТОВ ===== */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 480px) {
    .answers-grid { grid-template-columns: 1fr; }
  }

  .answer-btn {
    padding: 1rem 1.25rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-dim);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(124,108,240,0.15);
  }

  .answer-btn:active:not(:disabled) { transform: translateY(0); }

  .answer-btn.correct {
    background: var(--correct-dim);
    border-color: var(--correct);
    color: var(--correct);
    animation: pulse-correct 0.4s ease;
  }

  .answer-btn.wrong {
    background: var(--wrong-dim);
    border-color: var(--wrong);
    color: var(--wrong);
    animation: shake 0.4s ease;
  }

  .answer-btn:disabled { cursor: not-allowed; }

  @keyframes pulse-correct {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ===== КНОПКА ДАЛЕЕ ===== */
  .next-btn {
    display: none;
    width: 100%;
    padding: 1rem;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.04em;
    margin-top: 0.5rem;
  }

  .next-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .next-btn.visible { display: block; }

  /* ===== СТРИК УВЕДОМЛЕНИЕ ===== */
  .streak-notice {
    text-align: center;
    padding: 0.75rem;
    background: var(--correct-dim);
    border: 1px solid rgba(76,175,125,0.3);
    border-radius: var(--radius-sm);
    color: var(--correct);
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 1rem;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .streak-notice.show { display: block; }

  /* ===== АДАПТИВНОСТЬ ===== */
  @media (max-width: 600px) {
    .question-card { padding: 1.75rem 1.25rem; }
    .quiz-header { flex-wrap: wrap; gap: 1rem; }
  }

  /* ===== ПОЛОСКА ПРОГРЕССА ===== */
  .streak-bar-wrap {
    height: 3px;
    background: var(--bg-3);
    border-radius: 2px;
    margin-bottom: 2rem;
    overflow: hidden;
  }

  .streak-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--correct), var(--accent));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ===== ПОДСКАЗКА В ВОПРОСЕ ===== */
  .hint-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===================== ГЛАВНЫЙ ЭКРАН ===================== -->
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <div class="logo-tag">ЦТ Prep · Английский</div>
      <h1 class="home-title">Preposition<br>Master</h1>
      <p class="home-subtitle">Выбери букву и тренируй предлоги и фразовые глаголы в режиме бесконечного теста</p>
    </div>

    <p class="section-label">Выбери букву алфавита</p>
    <div class="letter-grid" id="letter-grid"></div>
  </div>

  <!-- ===================== ЭКРАН ТЕСТА ===================== -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button class="back-btn" onclick="goHome()">← На главную</button>
      <div class="quiz-letter-badge" id="quiz-letter-badge">A</div>
    </div>

    <!-- Счётчик очков -->
    <div class="score-bar">
      <div class="score-item">
        <span class="score-num correct-color" id="score-correct">0</span>
        <span class="score-label">Верно</span>
      </div>
      <div class="score-item">
        <span class="score-num wrong-color" id="score-wrong">0</span>
        <span class="score-label">Ошибок</span>
      </div>
      <div class="score-item">
        <span class="score-num total-color" id="score-streak">0</span>
        <span class="score-label">Стрик 🔥</span>
      </div>
    </div>

    <!-- Прогресс-бар стрика -->
    <div class="streak-bar-wrap">
      <div class="streak-bar-fill" id="streak-bar"></div>
    </div>

    <!-- Стрик-уведомление -->
    <div class="streak-notice" id="streak-notice">🔥 Отличная серия!</div>

    <!-- Карточка вопроса -->
    <div class="question-card">
      <p class="question-category" id="q-category">Глагол</p>
      <div class="question-word" id="q-word">depend _____</div>
      <p class="hint-text" id="q-hint"></p>
    </div>

    <!-- Варианты ответов -->
    <div class="answers-grid" id="answers-grid"></div>

    <!-- Кнопка далее (при ошибке) -->
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующее слово →</button>
  </div>

</div>

<script>
/* =================================================================
   БАЗА ДАННЫХ ПРЕДЛОГОВ
   Формат каждой записи:
   {
     word: "слово или фраза с _____",
     preposition: "правильный предлог",
     hint: "подсказка или перевод" (необязательно),
     category: "verb" | "adj" | "noun" | "phrase"
   }

   Добавляй слова в соответствующий массив буквы.
   Каждая буква = отдельный массив в объекте DATA.
   ================================================================= */

const DATA = {

  /* ===== A ===== */
  A: [
    // Глаголы
    { word: "admire sb _____ sth", preposition: "for", hint: "восхищаться чем-то", category: "verb" },
    { word: "apologize _____ sb for sth", preposition: "to", hint: "извиняться перед кем-то", category: "verb" },
    { word: "aim _____", preposition: "at", hint: "нацеливаться", category: "verb" },
    { word: "arrive _____", preposition: "in", hint: "приехать (в город/страну)", category: "verb" },
    { word: "arrive _____", preposition: "at", hint: "приехать (на станцию/аэропорт)", category: "verb" },
    { word: "approve _____", preposition: "of", hint: "одобрять", category: "verb" },
    { word: "apply to sb _____ sth", preposition: "for", hint: "обращаться", category: "verb" },
    { word: "agree _____ sb", preposition: "with", hint: "соглашаться с кем-то", category: "verb" },
    { word: "agree _____ sth", preposition: "on", hint: "договариваться о чем-то", category: "verb" },
    { word: "associate _____", preposition: "with", hint: "ассоциироваться", category: "verb" },
    { word: "appeal _____", preposition: "to", hint: "обращаться, привлекать", category: "verb" },
    { word: "accuse _____", preposition: "of", hint: "обвинять", category: "verb" },
    { word: "ask _____", preposition: "for", hint: "просить", category: "verb" },
    { word: "ask _____", preposition: "about", hint: "спрашивать о", category: "verb" },
    { word: "argue with sb _____ sth", preposition: "about", hint: "спорить о чём-то", category: "verb" },
    // Существительные
    { word: "access _____", preposition: "to", hint: "доступ к", category: "noun" },
    { word: "advantage _____", preposition: "of", hint: "преимущество", category: "noun" },
    { word: "advertisement _____", preposition: "for", hint: "объявление", category: "noun" },
    { word: "advice _____", preposition: "on", hint: "совет", category: "noun" },
    { word: "attitude _____", preposition: "to", hint: "отношение к", category: "noun" },
    { word: "ability _____", preposition: "in", hint: "способность в", category: "noun" },
    // Прилагательные
    { word: "accompanied _____", preposition: "by", hint: "в сопровождении", category: "adj" },
    { word: "addicted _____", preposition: "to", hint: "зависимый", category: "adj" },
    { word: "amazed _____", preposition: "at", hint: "удивленный", category: "adj" },
    { word: "astonished _____", preposition: "at", hint: "удивленный", category: "adj" },
    { word: "accustomed _____", preposition: "to", hint: "привыкший", category: "adj" },
    { word: "afraid _____", preposition: "of", hint: "бояться", category: "adj" },
    { word: "angry _____ sb", preposition: "with", hint: "злиться на кого-то", category: "adj" },
    { word: "angry _____ sth", preposition: "about", hint: "злиться по поводу чего-то", category: "adj" },
    { word: "acquainted _____", preposition: "with", hint: "знаком с", category: "adj" },
    { word: "ashamed _____", preposition: "of", hint: "стыдиться", category: "adj" },
    { word: "aware _____", preposition: "of", hint: "осведомленный", category: "adj" },
    { word: "absorbed _____", preposition: "in", hint: "поглощенный", category: "adj" },
    { word: "allergic _____", preposition: "to", hint: "с аллергией на", category: "adj" },
    { word: "anxious _____", preposition: "about", hint: "встревоженный", category: "adj" },
    { word: "attached _____", preposition: "to", hint: "прикрепленный, привязан", category: "adj" },
    { word: "absent _____", preposition: "from", hint: "отсутствующий", category: "adj" },
    // Полезные фразы
    { word: "according _____", preposition: "to", hint: "в соответствии с", category: "phrase" },
    { word: "in addition _____", preposition: "to", hint: "в добавок", category: "phrase" },
    { word: "on _____", preposition: "average", hint: "в среднем", category: "phrase" },
    { word: "ahead _____", preposition: "of", hint: "впереди", category: "phrase" },
    { word: "in _____", preposition: "advance", hint: "заранее", category: "phrase" },
    { word: "apart _____", preposition: "from", hint: "кроме", category: "phrase" },
  ],

  /* ===== B ===== */
  B: [
    // Глаголы
    { word: "belong _____", preposition: "to", hint: "принадлежать", category: "verb" },
    { word: "benefit _____", preposition: "from", hint: "получать выгоду от", category: "verb" },
    { word: "blame _____ sb/sth", preposition: "on", hint: "винить кого-то", category: "verb" },
    { word: "blame _____ sth", preposition: "for", hint: "винить в чем-то", category: "verb" },
    { word: "borrow _____", preposition: "from", hint: "брать в долг у кого-то", category: "verb" },
    { word: "begin _____", preposition: "with", hint: "начинать с", category: "verb" },
    { word: "believe _____", preposition: "in", hint: "верить в", category: "verb" },
    { word: "boast _____", preposition: "of", hint: "хвастаться", category: "verb" },
    { word: "bump _____", preposition: "into", hint: "врезаться в", category: "verb" },
    { word: "border _____", preposition: "on", hint: "граничить с", category: "verb" },
    // Существительные
    { word: "put/lay the blame _____ sb/sth", preposition: "on", hint: "перекладывать вину на", category: "noun" },
    // Прилагательные
    { word: "bad _____", preposition: "at", hint: "плох в", category: "adj" },
    { word: "based _____", preposition: "on", hint: "основан на", category: "adj" },
    { word: "bored _____ sth", preposition: "with", hint: "утомленный чем-то", category: "adj" },
    { word: "brilliant _____", preposition: "at", hint: "хорош в", category: "adj" },
    { word: "busy _____", preposition: "with", hint: "занят чем-то", category: "adj" },
    { word: "born into a _____ family", preposition: "rich", hint: "родиться в семье", category: "adj" },
    // Фразы
    { word: "in _____", preposition: "brief", hint: "коротко", category: "phrase" },
    { word: "in the _____", preposition: "beginning", hint: "изначально", category: "phrase" },
    { word: "at _____", preposition: "breakfast", hint: "за завтраком", category: "phrase" },
    { word: "for _____", preposition: "breakfast", hint: "на завтрак", category: "phrase" },
    { word: "in _____", preposition: "bed", hint: "в кровати", category: "phrase" },
    { word: "on behalf _____", preposition: "of", hint: "от лица", category: "phrase" },
    { word: "on _____", preposition: "balance", hint: "в целом, в общем", category: "phrase" },
    { word: "by _____", preposition: "bus", hint: "на автобусе", category: "phrase" },
    { word: "on the _____", preposition: "beach", hint: "на пляже", category: "phrase" },
    { word: "on _____", preposition: "business", hint: "по работе", category: "phrase" },
  ],

  /* ===== C ===== */
  C: [
    // Глаголы
    { word: "care _____", preposition: "about", hint: "заботиться о", category: "verb" },
    { word: "care _____", preposition: "for", hint: "проявлять любовь, хотеть", category: "verb" },
    { word: "charge _____", preposition: "for", hint: "взимать плату за", category: "verb" },
    { word: "charge _____ with", preposition: "with", hint: "обвинить в", category: "verb" },
    { word: "comment _____", preposition: "on", hint: "комментировать", category: "verb" },
    { word: "compliment _____", preposition: "on", hint: "сделать комплимент", category: "verb" },
    { word: "congratulate _____", preposition: "on", hint: "поздравлять с", category: "verb" },
    { word: "concentrate _____", preposition: "on", hint: "концентрироваться на", category: "verb" },

/* =================================================================
   ПУЛА ПРЕДЛОГОВ для генерации неправильных ответов
   Можно расширить этот список
   ================================================================= */
const ALL_PREPOSITIONS = [
  "in", "on", "at", "with", "by", "for", "about", "of", "to",
  "from", "off", "up", "into", "out", "through", "over", "under",
  "after", "before", "since", "during", "along", "across", "between",
  "among", "against", "without", "within", "beyond", "behind", "beside",
  "below", "above", "near", "around", "towards", "throughout"
];

/* =================================================================
   КАТЕГОРИИ (для отображения)
   ================================================================= */
const CATEGORY_LABELS = {
  verb: "Глагол",
  adj: "Прилагательное",
  noun: "Существительное",
  phrase: "Фраза"
};

/* =================================================================
   СОСТОЯНИЕ ПРИЛОЖЕНИЯ
   ================================================================= */
let currentLetter = null;
let currentWords = [];
let currentItem = null;
let scoreCorrect = 0;
let scoreWrong = 0;
let streak = 0;
let answered = false;

/* =================================================================
   ИНИЦИАЛИЗАЦИЯ
   ================================================================= */
function init() {
  renderLetterGrid();
}

/* Рендеринг сетки букв */
function renderLetterGrid() {
  const grid = document.getElementById('letter-grid');
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  grid.innerHTML = alphabet.map(letter => {
    const words = DATA[letter] || [];
    const count = words.length;
    const hasWords = count > 0;

    return `<button 
      class="letter-btn" 
      ${hasWords ? `onclick="startQuiz('${letter}')"` : 'disabled'}
      title="${hasWords ? `${count} фраз` : 'Нет данных'}"
    >
      ${letter}
      <span class="count">${hasWords ? count : '—'}</span>
    </button>`;
  }).join('');
}

/* =================================================================
   НАВИГАЦИЯ
   ================================================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  showScreen('screen-home');
  currentLetter = null;
  scoreCorrect = 0;
  scoreWrong = 0;
  streak = 0;
}

/* =================================================================
   ЗАПУСК ТЕСТА ПО БУКВЕ
   ================================================================= */
function startQuiz(letter) {
  currentLetter = letter;
  currentWords = [...(DATA[letter] || [])];
  scoreCorrect = 0;
  scoreWrong = 0;
  streak = 0;

  document.getElementById('quiz-letter-badge').textContent = letter;
  updateScoreDisplay();

  showScreen('screen-quiz');
  nextQuestion();
}

/* =================================================================
   СЛЕДУЮЩИЙ ВОПРОС
   ================================================================= */
function nextQuestion() {
  answered = false;

  // Скрываем кнопку "Далее" и уведомление о стрике
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('streak-notice').classList.remove('show');

  // Выбираем случайный элемент из массива буквы
  currentItem = currentWords[Math.floor(Math.random() * currentWords.length)];

  // Отображаем вопрос
  const categoryLabel = CATEGORY_LABELS[currentItem.category] || 'Слово';
  document.getElementById('q-category').textContent = categoryLabel;

  // Формируем текст с пропуском
  const displayWord = currentItem.word.includes('_____')
    ? currentItem.word.replace('_____', '<span class="question-blank">_____</span>')
    : `${currentItem.word} <span class="question-blank">_____</span>`;

  document.getElementById('q-word').innerHTML = displayWord;
  document.getElementById('q-hint').textContent = currentItem.hint || '';

  // Генерируем варианты ответов
  renderAnswers();
}

/* =================================================================
   ГЕНЕРАЦИЯ ВАРИАНТОВ ОТВЕТА
   Правило: 1 правильный + 4 уникальных неправильных
   ================================================================= */
function renderAnswers() {
  const correct = currentItem.preposition;

  // Пул всех предлогов из данных (чтобы ответы были реалистичными)
  const allPreps = new Set(ALL_PREPOSITIONS);
  allPreps.delete(correct); // Убираем правильный

  // Перемешиваем и берём 4 неправильных
  const wrongPool = shuffle([...allPreps]);
  const wrongs = wrongPool.slice(0, 4);

  // Итоговый список из 5 вариантов в случайном порядке
  const options = shuffle([correct, ...wrongs]);

  const grid = document.getElementById('answers-grid');
  grid.innerHTML = options.map(opt => `
    <button class="answer-btn" onclick="checkAnswer(this, '${opt}', '${correct}')">
      ${opt}
    </button>
  `).join('');
}

/* =================================================================
   ПРОВЕРКА ОТВЕТА
   ================================================================= */
function checkAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.answer-btn');

  // Блокируем все кнопки
  allBtns.forEach(b => b.disabled = true);

  if (selected === correct) {
    // ПРАВИЛЬНЫЙ ОТВЕТ
    btn.classList.add('correct');
    scoreCorrect++;
    streak++;
    updateScoreDisplay();
    updateStreakBar();

    // Показываем уведомление о серии
    if (streak > 0 && streak % 5 === 0) {
      const notice = document.getElementById('streak-notice');
      notice.textContent = `🔥 Серия ${streak}! Отлично!`;
      notice.classList.add('show');
    }

    // Автопереход через 1.2 секунды
    setTimeout(nextQuestion, 1200);

  } else {
    // НЕПРАВИЛЬНЫЙ ОТВЕТ
    btn.classList.add('wrong');
    streak = 0;
    scoreWrong++;
    updateScoreDisplay();
    updateStreakBar();

    // Подсвечиваем правильный
    allBtns.forEach(b => {
      if (b.textContent.trim() === correct) {
        b.classList.add('correct');
      }
    });

    // Показываем кнопку "Далее"
    document.getElementById('next-btn').classList.add('visible');
  }
}

/* =================================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ================================================================= */

/* Обновить отображение счёта */
function updateScoreDisplay() {
  document.getElementById('score-correct').textContent = scoreCorrect;
  document.getElementById('score-wrong').textContent = scoreWrong;
  document.getElementById('score-streak').textContent = streak;
}

/* Обновить полосу стрика (макс 10 = 100%) */
function updateStreakBar() {
  const pct = Math.min((streak / 10) * 100, 100);
  document.getElementById('streak-bar').style.width = pct + '%';
}

/* Перемешать массив (Fisher-Yates) */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
